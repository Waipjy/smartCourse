# 發布到 GitHub Pages：
#   /     -> learning/20_mqtt_dashboard（儀表板）
#   /3d/  -> learning/mediapipe_3d（裸眼 3D，攝影機需要 HTTPS）
# 網址：https://<帳號>.github.io/<repo 名稱>/
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "learning/20_mqtt_dashboard/**"
      - "learning/mediapipe_3d/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site/3d
          cp -r learning/20_mqtt_dashboard/. _site/
          cp learning/mediapipe_3d/index.html _site/3d/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
